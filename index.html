<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My music player </title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#7928CA"><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet"><style>body{font-family:'Outfit',sans-serif}input[type=file]{display:none}</style></head><body class="bg-[#050507] text-white min-h-screen p-4"><div class="max-w-md mx-auto"><div class="flex justify-between items-center py-5"><button onclick="location.href='/'" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center">✕</button><div class="flex items-center gap-2"><div class="w-8 h-8 rounded-xl bg-gradient-to-br from-[#7928CA] to-[#FF0080] flex items-center justify-center overflow-hidden">🎵</div><h1 class="font-black tracking-widest text-xs">MY MUSIC PLAYER </h1></div><label class="w-10 h-10 rounded-full bg-gradient-to-r from-pink-500 to-purple-600 flex items-center justify-center cursor-pointer">+<input type="file" accept="audio/*,.mp3,.ogg,.wav,.m4a,.flac" multiple onchange="loadFiles(this.files)"></label></div><div class="bg-white/[0.06] backdrop-blur-2xl border border-white/10 rounded- p-7"><div id="cover" class="w-full h- rounded- bg-gradient-to-br from-pink-500 via-purple-600 to-cyan-400 flex items-center justify-center text-8xl overflow-hidden">🎵</div><h2 id="title" class="text-xl font-black mt-6 truncate">My music player </h2><p class="text-white/40 text-xs tracking-widest mt-1">FROM YOUR PHONE</p><audio id="audio" preload="auto"></audio><div class="mt-7"><div onclick="seek(event)" class="h-1.5 bg-white/10 rounded-full overflow-hidden cursor-pointer"><div id="bar" class="h-full bg-gradient-to-r from-pink-500 to-purple-500 w-0"></div></div><div class="flex justify-between mt-2 text- text-white/30 font-bold"><span id="cur">0:00</span><span id="dur">0:00</span></div></div><div class="flex justify-between items-center mt-8 px-4"><button onclick="prev()" class="w-14 h-14 rounded-full bg-white/[0.06]">⏮️</button><button id="play" onclick="toggle()" class="w-20 h-20 rounded-full bg-gradient-to-r from-pink-500 to-purple-600 text-4xl shadow-[0_0_50px_rgba(255,20,147,0.6)]">▶️</button><button onclick="next()" class="w-14 h-14 rounded-full bg-white/[0.06]">⏭️</button></div></div><div id="list" class="mt-6 space-y-2"></div><label class="mt-6 w-full py-4 rounded-2xl border border-dashed border-pink-500/30 bg-pink-500/5 flex flex-col items-center justify-center cursor-pointer"><span class="text-2xl">🎵</span><span class="text-xs mt-1 text-pink-300">Add songs</span><input type="file" accept="audio/*,.mp3,.ogg,.wav,.m4a,.flac,.aac" multiple onchange="loadFiles(this.files)"></label></div><script>
let songs=[], idx=0; const audio=document.getElementById('audio');
let HAS_CUSTOM_IMAGE = false;
function loadFiles(files){ for(let f of files){ songs.push({name:f.name.replace(/\.[^/.]+$/, ''), url:URL.createObjectURL(f)}) } if(songs.length) load(songs.length-files.length); render(); if(audio.paused) toggle(); }
const demos=[{name:"Chill Vibe (demo)", url:"https://cdn.pixabay.com/audio/2022/03/10/audio_0021c7b3f5.mp3"}]; songs=[...demos];
function load(n){ idx=n; let s=songs[n]; document.getElementById('title').innerText=s.name;
 if(!HAS_CUSTOM_IMAGE){ document.getElementById('cover').innerText=['💿','🌙','💖','⚡️','🔥'][n%5]; }
 audio.src=s.url; render();
}
function toggle(){ if(!songs.length) return alert('Add a song first!'); if(audio.paused){ audio.play().then(()=>{document.getElementById('play').innerText='⏸️'}).catch(()=>{}); } else{ audio.pause(); document.getElementById('play').innerText='▶️'; } }
function next(){ load((idx+1)%songs.length); audio.play(); document.getElementById('play').innerText='⏸️'; } function prev(){ load((idx-1+songs.length)%songs.length); audio.play(); document.getElementById('play').innerText='⏸️'; }
function seek(e){ const r=e.currentTarget.getBoundingClientRect(); const p=(e.clientX-r.left)/r.width; if(audio.duration) audio.currentTime=p*audio.duration; }
function render(){ document.getElementById('list').innerHTML=songs.map((s,i)=>`<div onclick="load(${i}); audio.play();" class="flex justify-between items-center p-4 rounded-2xl cursor-pointer ${i==idx?'bg-gradient-to-r from-pink-500/20 to-purple-600/20 border border-pink-500/30':'bg-white/[0.04]'}"><div class="flex gap-3 items-center"><div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center">${i==idx?'🎶':'🎵'}</div><div><p class="text-sm font-bold truncate w-40">${s.name}</p></div></div></div>`).join(''); }
audio.ontimeupdate=()=>{ if(!audio.duration) return; document.getElementById('bar').style.width=(audio.currentTime/audio.duration*100)+'%'; document.getElementById('cur').innerText=fmt(audio.currentTime); };
audio.onloadedmetadata=()=>document.getElementById('dur').innerText=fmt(audio.duration); audio.onended=next;
function fmt(s){ if(isNaN(s)) return '0:00'; let m=Math.floor(s/60), ss=Math.floor(s%60); return m+':'+String(ss).padStart(2,'0'); } load(0); render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script></body></html>
